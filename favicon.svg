<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#42a5f5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#64b5f6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Inner subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Grid lines decoration -->
  <line x1="0" y1="16" x2="64" y2="16" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0" y1="32" x2="64" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0" y1="48" x2="64" y2="48" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="16" y1="0" x2="16" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="32" y1="0" x2="32" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="48" y1="0" x2="48" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Letter A -->
  <text x="32" y="47" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="-1">A</text>
  <!-- Accent dot below A -->
  <circle cx="32" cy="56" r="2.5" fill="url(#glow)" opacity="0.8"/>
</svg>
